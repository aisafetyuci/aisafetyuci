name: Keep Supabase Alive

on:
  schedule:
    # Runs once a day at 14:17 UTC (around 7am Pacific)
    - cron: "17 14 * * *"
  # Lets you run it manually from the Actions tab to test it
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keep_alive database function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl --silent --show-error \
            -o response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP status: $status"
          echo "Response:"
          cat response.txt
          echo

          if [ "$status" -ge 400 ]; then
            exit 1
          fi
