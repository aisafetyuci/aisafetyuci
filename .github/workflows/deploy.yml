name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # /events is built from the club Google Calendar, so rebuild daily to pick up calendar edits.
  # To pull them in right away: Actions tab → this workflow → Run workflow.
  schedule:
    - cron: '0 13 * * *' # 6 AM Pacific (5 AM in winter)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloudflare (the live site) rebuilds on its own after a push, but not on a schedule, so
      # scheduled and manual runs deploy to it from here. Needs repo secrets CLOUDFLARE_API_TOKEN
      # (Workers edit permission) and CLOUDFLARE_ACCOUNT_ID; the step is skipped without them.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      - name: Deploy to Cloudflare (scheduled and manual runs)
        if: github.event_name != 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
