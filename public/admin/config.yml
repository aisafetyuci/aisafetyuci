# Blog editor (Sveltia CMS) at aisafetyuci.org/admin.
# It edits content/blog/*.md by committing to GitHub; app/lib/blog.ts checks every post at build time,
# so keep the fields below in step with that file.
# Anyone with write access to the GitHub repo can sign in and publish.

backend:
  name: github
  repo: aisafetyuci/aisafetyuci
  # Published posts go to main, which deploys the live site. Drafts live on cms/... branches until published.
  branch: main
  # Login helper (Sveltia CMS Authenticator) on the club Cloudflare account.
  base_url: https://sveltia-cms-auth.aisafetyatuci.workers.dev
  # The repo is public, so sign-in only asks for access to public repos, not private ones.
  auth_scope: public_repo

# Each draft is a pull request; Cloudflare builds it, and the editor links to that preview.
publish_mode: editorial_workflow
site_url: https://aisafetyuci.org

# File names must be lowercase words joined by hyphens (checked in app/lib/blog.ts).
slug:
  encoding: ascii
  clean_accents: true
  # Short enough that the draft preview address (cms-blog-<name>-aisafetyuci) stays under 63 characters.
  maxlength: 42

output:
  # Leave unfilled optional fields out of the file instead of writing empty values.
  omit_empty_optional_fields: true

media_folder: public/images/blog
public_folder: /images/blog
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: Posts appear at aisafetyuci.org/blog about 2 minutes after publishing.
    folder: content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{title}}'
    preview_path: /blog/{{slug}}
    sortable_fields: [date, title]
    summary: '{{title}} ({{date}})'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences. Shown on the blog page, in link previews and in the RSS feed.
      - name: authors
        label: Authors
        widget: list
        min: 1
        hint: One name per item. Use the name exactly as on the Team page to show their photo.
      - name: category
        label: Category
        widget: select
        options: [Explainer, Research, Recap, Opinion, Announcement]
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: Optional. Shown on the post and in the blog list. Landscape works best (1200×630).
      - name: coverAlt
        label: Cover image description
        widget: string
        required: false
        hint: Required if you add a cover image. Describe it for people who can't see it.
      - name: featured
        label: Feature at top of blog
        widget: boolean
        default: false
        required: false
        hint: The newest featured post gets the large card at the top of /blog. If none is featured, the newest post does.
      - name: updated
        label: Last updated
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
        hint: Optional. Set this when you make a meaningful change after publishing.
      - { name: body, label: Post, widget: markdown }

  # Research projects: one file per project in content/research/*.md, checked by app/lib/research.ts.
  # Open projects appear at /research and in the application form at /research/apply.
  - name: research
    label: Research projects
    label_singular: Research project
    description: Open projects appear at aisafetyuci.org/research and in the application form about 2 minutes after publishing.
    folder: content/research
    extension: md
    format: frontmatter
    create: true
    slug: '{{title}}'
    preview_path: /research/{{slug}}
    summary: '{{title}} ({{status}})'
    fields:
      - { name: title, label: Title, widget: string }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences. Shown on the project card and in the application form.
      - name: status
        label: Status
        widget: select
        options: [open, closed]
        default: open
        hint: Closed projects leave the application form but keep their page.
      - { name: duration, label: Duration, widget: string, hint: 'For example "2–3 weeks".' }
      - { name: team, label: Team size, widget: string, required: false, hint: 'For example "2–3 people".' }
      - { name: skills, label: Skills needed, widget: string, required: false, hint: 'For example "Python and API calls".' }
      - { name: commitment, label: Time commitment, widget: string, required: false, hint: 'For example "4–6 hrs/week".' }
      - name: format
        label: Format
        widget: select
        options: [In person, Online, Hybrid]
        required: false
      - name: leads
        label: Project leads
        widget: list
        required: false
        hint: One name per item. Leave empty until leads are chosen.
      - name: constraints
        label: Constraints or notes for applicants
        widget: list
        required: false
      - { name: onePagerUrl, label: Link to a longer one-pager, widget: string, required: false, pattern: ['^https://', 'Must be a full https:// link'], hint: 'Optional full https:// link, e.g. a Google Doc.' }
      - name: extraQuestion
        label: Extra application question
        widget: string
        required: false
        hint: Optional. Asked only of people applying to this project, after the two standard questions.
      - { name: draft, label: Draft (hide from the live site), widget: boolean, default: false, required: false }
      - { name: body, label: One-pager, widget: markdown }
